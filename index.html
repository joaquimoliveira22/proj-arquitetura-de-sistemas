<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema - Filmes em Cartaz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-menu">
    <button class="menu-btn" id="menuBtn">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <div class="menu-options" id="menuOptions">
        <a href="admin.html">Acessar Administração</a>
    </div>
</div>

    <header>
        <h1>FILMES EM CARTAZ</h1>
        <p>Confira as sessões disponíveis e escolha seu ingresso</p>
    </header>

    <div class="filmes-container" id="filmesContainer">
        <!-- Filmes serão carregados aqui via JavaScript -->
    </div>
   
    <script>
        document.addEventListener('DOMContentLoaded', function() {
    // Função principal para carregar filmes
    function carregarFilmes() {
        const container = document.getElementById('filmesContainer');
        const filmesData = JSON.parse(localStorage.getItem('filmesEmCartaz')) || [];
        
        container.innerHTML = '';
        
        if (filmesData.length === 0) {
            container.innerHTML = `
                <div class="sem-filmes">
                    <p>Nenhum filme em cartaz no momento.</p>
                </div>
            `;
            return;
        }
        
        filmesData.forEach(filme => {
            if (filme.sessoes && filme.sessoes.length > 0) {
                const card = document.createElement('div');
                card.className = 'filme-card';
                card.dataset.id = filme.id;
                
                card.innerHTML = `
                    <button class="btn-remover-filme" title="Remover filme">×</button>
                    <img src="${filme.imagem}" alt="${filme.nome}" class="filme-poster">
                    <div class="filme-info">
                        <h2 class="filme-titulo">${filme.nome}</h2>
                        ${filme.sessoes.map(sessao => `
                            <div class="filme-sessao">
                                <span class="sessao-hora">${sessao.horario}</span>
                                <span class="sessao-sala">Sala ${sessao.sala}</span>
                            </div>
                        `).join('')}
                        <h3 class="ingressos-titulo">Ingressos disponíveis:</h3>
                        <div class="ingressos-lista">
                            ${filme.ingressos.map(ingresso => `
                                <div class="ingresso-item ${ingresso.tipo}">
                                    <span class="ingresso-tipo">${ingresso.tipo}</span>
                                    <span class="ingresso-valor">R$ ${ingresso.valor.toFixed(2)}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            }
        });
        
        // Configura os eventos de remoção após criar os cards
        setupRemocaoFilmes();
    }

    // Função para configurar os eventos de remoção
    function setupRemocaoFilmes() {
        document.querySelectorAll('.btn-remover-filme').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const filmeCard = this.closest('.filme-card');
                const filmeId = filmeCard.dataset.id;
                const filmeNome = filmeCard.querySelector('.filme-titulo').textContent;
                
                if (confirm(`Tem certeza que deseja remover "${filmeNome}" e todas as suas sessões?`)) {
                    removerFilme(filmeId);
                }
            });
        });
    }

    // Função para remover filme do sistema
    function removerFilme(id) {
        // Obter dados atuais
        let filmes = JSON.parse(localStorage.getItem('filmes')) || [];
        let sessoes = JSON.parse(localStorage.getItem('sessoes')) || [];
        let ingressos = JSON.parse(localStorage.getItem('ingressos')) || [];
        
        // Remover o filme
        filmes = filmes.filter(filme => filme.id !== id);
        
        // Remover sessões relacionadas
        const sessoesParaRemover = sessoes.filter(sessao => sessao.filmeId === id);
        sessoes = sessoes.filter(sessao => sessao.filmeId !== id);
        
        // Remover ingressos relacionados
        const idsSessoes = sessoesParaRemover.map(s => s.id);
        ingressos = ingressos.filter(ingresso => !idsSessoes.includes(ingresso.sessaoId));
        
        // Atualizar localStorage
        localStorage.setItem('filmes', JSON.stringify(filmes));
        localStorage.setItem('sessoes', JSON.stringify(sessoes));
        localStorage.setItem('ingressos', JSON.stringify(ingressos));
        
        // Atualizar filmes em cartaz
        atualizarFilmesEmCartaz();
        
        // Recarregar a exibição
        carregarFilmes();
    }

    // Função para atualizar filmes em cartaz
    function atualizarFilmesEmCartaz() {
        const filmes = JSON.parse(localStorage.getItem('filmes')) || [];
        const sessoes = JSON.parse(localStorage.getItem('sessoes')) || [];
        const ingressos = JSON.parse(localStorage.getItem('ingressos')) || [];
        
        const filmesAtualizados = filmes.map(filme => {
            return {
                ...filme,
                sessoes: sessoes.filter(s => s.filmeId === filme.id),
                ingressos: ingressos.filter(i => {
                    const sessao = sessoes.find(s => s.id === i.sessaoId);
                    return sessao && sessao.filmeId === filme.id;
                })
            };
        });
        
        localStorage.setItem('filmesEmCartaz', JSON.stringify(filmesAtualizados));
    }

    // Inicialização
    carregarFilmes();
    
    // Atualizar quando houver mudanças em outras abas
    window.addEventListener('storage', function() {
        carregarFilmes();
    });
});
// Menu de Administração
document.addEventListener('DOMContentLoaded', function() {
    const menuBtn = document.getElementById('menuBtn');
    const menuOptions = document.getElementById('menuOptions');

    // Abrir/fechar menu
    menuBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        menuOptions.classList.toggle('show');
    });

    // Fechar menu ao clicar fora
    document.addEventListener('click', function(e) {
        if (!menuOptions.contains(e.target) && e.target !== menuBtn) {
            menuOptions.classList.remove('show');
        }
    });

    // Fechar menu ao rolar
    window.addEventListener('scroll', function() {
        menuOptions.classList.remove('show');
    });

    // ... (mantenha o resto do seu código)
});
    </script>
</body>
</html>
